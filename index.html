<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleven Systems — Opportunity Plan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f4f1;--bg-tertiary:#eeede9;
  --bg-info:#e6f1fb;--bg-success:#eaf3de;--bg-warning:#faeeda;--bg-danger:#fcebeb;
  --text-primary:#1a1a18;--text-secondary:#5f5e5a;--text-tertiary:#888780;
  --text-info:#185fa5;--text-success:#3b6d11;--text-warning:#854f0b;--text-danger:#a32d2d;
  --border-light:rgba(0,0,0,0.10);--border-mid:rgba(0,0,0,0.18);--border-strong:rgba(0,0,0,0.28);
  --border-info:#b5d4f4;--border-success:#c0dd97;--border-warning:#fac775;--border-danger:#f7c1c1;
  --radius-md:8px;--radius-lg:12px;--font:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --green-pip:#1D9E75;--amber-pip:#EF9F27;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#1e1e1c;--bg-secondary:#27271f;--bg-tertiary:#2e2e26;
  --bg-info:#0c3352;--bg-success:#172f08;--bg-warning:#3d2406;--bg-danger:#3a1212;
  --text-primary:#f0efe8;--text-secondary:#b4b2a9;--text-tertiary:#888780;
  --text-info:#85b7eb;--text-success:#97c459;--text-warning:#ef9f27;--text-danger:#f09595;
  --border-light:rgba(255,255,255,0.08);--border-mid:rgba(255,255,255,0.14);--border-strong:rgba(255,255,255,0.22);
  --border-info:#185fa5;--border-success:#3b6d11;--border-warning:#854f0b;--border-danger:#a32d2d;
  --green-pip:#5DCAA5;--amber-pip:#FAC775;
}}
body{font-family:var(--font);background:var(--bg-secondary);color:var(--text-primary);min-height:100vh}

/* ── Header ── */
.page-header{background:var(--bg-primary);border-bottom:0.5px solid var(--border-light);padding:14px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-header-left h1{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.page-header-left p{font-size:11px;color:var(--text-tertiary);margin-top:1px}
.header-score{display:flex;gap:8px;align-items:center;flex-shrink:0}
.header-score .sc{font-size:12px;color:var(--text-secondary)}
.forecast-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.fc-commit{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.fc-upside{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.fc-pipeline{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.fc-omit{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}

/* ── Opportunity selector bar ── */
.opp-bar{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.opp-btn{font-size:13px;font-family:var(--font);padding:6px 14px;border-radius:20px;border:0.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer;transition:all 0.15s}
.opp-btn:hover{background:var(--bg-tertiary)}
.opp-btn.active{background:var(--bg-info);color:var(--text-info);border-color:var(--border-info);font-weight:500}
.add-opp-btn{font-size:13px;font-family:var(--font);padding:6px 14px;border-radius:20px;border:0.5px dashed var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer}
.add-opp-btn:hover{color:var(--text-secondary);border-color:var(--border-strong)}

/* ── App shell: sidebar + content ── */
.app-shell{display:flex;gap:0;min-height:calc(100vh - 56px)}
.sidebar{width:168px;flex-shrink:0;padding:20px 12px 40px;display:flex;flex-direction:column;gap:4px;border-right:0.5px solid var(--border-light);background:var(--bg-primary);position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-tertiary);padding:8px 8px 4px;margin-top:4px}
.sidebar-label:first-child{margin-top:0;padding-top:0}
.nav-pill{font-size:13px;font-family:var(--font);padding:7px 12px;border-radius:20px;border:0.5px solid transparent;background:transparent;color:var(--text-secondary);cursor:pointer;text-align:left;width:100%;transition:all 0.12s;display:flex;align-items:center;justify-content:space-between;gap:6px;line-height:1.3}
.nav-pill:hover{background:var(--bg-secondary);color:var(--text-primary)}
.nav-pill.active{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary);font-weight:500}
.nav-pill.active .nav-pip{background:var(--bg-primary);opacity:0.5}
.nav-pip{width:6px;height:6px;border-radius:50%;background:var(--green-pip);flex-shrink:0;opacity:0}
.nav-pip.filled{opacity:1}
.content-area{flex:1;padding:24px 28px 60px;min-width:0}

/* ── Slides ── */
.slide{display:none;background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:22px 24px 24px}
.slide.visible{display:block}
.slide-title{font-size:18px;font-weight:600;letter-spacing:-0.01em;margin-bottom:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field-full{margin-bottom:10px}
.field-label{font-size:11px;color:var(--text-tertiary);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:5px}
.fmt-hint{font-size:10px;color:var(--text-tertiary);font-weight:400;text-transform:none;letter-spacing:0;opacity:0.75}
.field-input{width:100%;font-size:13px;font-family:var(--font);color:var(--text-primary);background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:7px 10px;resize:none;outline:none;line-height:1.5;transition:border-color 0.15s}
.field-input:focus{border-color:var(--border-strong)}
.field-input::placeholder{color:var(--text-tertiary)}
.field-input.fmt-ok{border-color:var(--border-success)}
.field-input.fmt-err{border-color:var(--border-danger)}
select.field-input{cursor:pointer}
.sec-div{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:14px 0 8px;border-top:0.5px solid var(--border-light);margin-top:4px}
.sec-div.first{border-top:none;margin-top:0;padding-top:0}
.chip-group{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-family:var(--font);padding:3px 10px;border-radius:4px;border:0.5px solid var(--border-mid);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.chip:hover{background:var(--bg-tertiary)}
.chip.sel-green{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.chip.sel-amber{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning);font-weight:500}
.chip.sel-red{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger);font-weight:500}
.chip.sel-blue{background:var(--bg-info);color:var(--text-info);border-color:var(--border-info);font-weight:500}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.stk-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px;position:relative;padding-bottom:28px}
.role-badge{font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;margin-bottom:8px;display:inline-block}
.role-economic-buyer{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.role-champion{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.role-coach{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.role-blocker{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.role-neutral{background:var(--bg-tertiary);color:var(--text-secondary);border:0.5px solid var(--border-mid)}
.stk-input{background:transparent;border:none;outline:none;font-family:var(--font);width:100%}
.stk-name{font-size:13px;font-weight:500;color:var(--text-primary)}
.stk-sub{font-size:11px;color:var(--text-tertiary)}
.stk-win{font-size:11px;color:var(--text-secondary);border-bottom:0.5px solid var(--border-light);padding:2px 0;margin-top:6px}
.sc-remove{position:absolute;bottom:8px;right:8px;font-size:11px;color:var(--text-tertiary);background:none;border:none;cursor:pointer;font-family:var(--font)}
.sc-remove:hover{color:var(--text-danger)}
.pov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pov-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px}
.pov-q{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.obj-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.obj-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:6px 10px;text-align:left;border-bottom:0.5px solid var(--border-mid)}
.obj-table td{padding:4px 10px;border-bottom:0.5px solid var(--border-light);vertical-align:top}
.obj-table tr:last-child td{border-bottom:none}
.obj-table td:first-child{color:var(--text-secondary);white-space:nowrap;font-weight:500}
.medd-score-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.medd-score-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px;text-align:center}
.medd-score-card .lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.medd-score-card .val{font-size:20px;font-weight:600;color:var(--text-primary);line-height:1}
.medd-section{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);margin-bottom:6px;overflow:hidden}
.medd-section-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;transition:background 0.12s}
.medd-section-header:hover{background:var(--bg-tertiary)}
.medd-left{display:flex;align-items:center;gap:10px}
.medd-icon{width:28px;height:28px;border-radius:var(--radius-md);background:var(--bg-primary);border:0.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.medd-icon svg{width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.medd-title-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.medd-title{font-size:13px;font-weight:500}
.blocker-tag{font-size:10px;font-weight:500;color:var(--text-danger);background:var(--bg-danger);padding:2px 5px;border-radius:3px;border:0.5px solid var(--border-danger)}
.medd-desc{font-size:11px;color:var(--text-tertiary)}
.pip-row{display:flex;gap:3px;margin-top:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--border-mid)}
.pip.filled{background:var(--green-pip)}
.pip.partial{background:var(--amber-pip)}
.chevron{width:14px;height:14px;flex-shrink:0;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s}
.chevron.open{transform:rotate(180deg)}
.medd-body{border-top:0.5px solid var(--border-light);padding:4px 14px 12px}
.medd-question{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:0.5px solid var(--border-light)}
.medd-question:last-of-type{border-bottom:none}
.q-text{font-size:13px;line-height:1.5;flex:1}
.q-tag{font-size:10px;color:var(--text-tertiary);margin-top:2px}
.tog-group{display:flex;gap:4px;flex-shrink:0;margin-top:1px}
.tog{font-size:12px;font-family:var(--font);padding:3px 10px;border-radius:5px;border:0.5px solid var(--border-mid);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.tog:hover{background:var(--bg-secondary)}
.tog.yes{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.tog.no{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger);font-weight:500}
.medd-notes{padding:6px 0 0}
.medd-notes textarea{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:6px 9px;resize:vertical;outline:none;line-height:1.5}
.medd-notes textarea:focus{border-color:var(--border-strong)}
.medd-notes textarea::placeholder{color:var(--text-tertiary)}
.gaps-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.gaps-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:5px 8px;text-align:left;border-bottom:0.5px solid var(--border-mid);white-space:nowrap}
.gaps-table td{padding:5px 8px;border-bottom:0.5px solid var(--border-light);vertical-align:middle}
.gaps-table tr:last-child td{border-bottom:none}
.gap-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-block;white-space:nowrap}
.gap-blocker{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.gap-custom{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.gaps-table td input,.gaps-table td select{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:transparent;border:none;outline:none;padding:2px 0;line-height:1.4}
.gaps-table td input::placeholder{color:var(--text-tertiary)}
.gaps-empty{font-size:12px;color:var(--text-success);padding:8px 0;display:flex;align-items:center;gap:6px}
.gaps-empty-dot{width:8px;height:8px;border-radius:50%;background:var(--green-pip);flex-shrink:0}
.gaps-add-btn{font-size:11px;font-family:var(--font);padding:4px 10px;border-radius:var(--radius-md);border:0.5px dashed var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer;margin-top:2px}
.gaps-add-btn:hover{color:var(--text-secondary)}
.gap-rm{font-size:11px;color:var(--text-tertiary);background:none;border:none;cursor:pointer;font-family:var(--font)}
.gap-rm:hover{color:var(--text-danger)}
.ask-box{background:var(--bg-warning);border:0.5px solid var(--border-warning);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px}
.ask-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-warning);margin-bottom:5px}
.ask-box textarea{background:transparent;border:none;color:var(--text-primary);font-size:13px;font-family:var(--font);width:100%;resize:none;outline:none;line-height:1.5}
.ask-box textarea::placeholder{color:var(--text-warning);opacity:0.6}
.map-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.map-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:6px 8px;text-align:left;border-bottom:0.5px solid var(--border-mid)}
.map-table td{padding:4px 8px;border-bottom:0.5px solid var(--border-light);vertical-align:top}
.map-table tr:last-child td{border-bottom:none}
.map-table td input,.map-table td select{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:transparent;border:none;outline:none;padding:3px 0}
.map-table td input::placeholder{color:var(--text-tertiary)}
.add-row-btn{font-size:12px;font-family:var(--font);padding:5px 12px;border-radius:var(--radius-md);border:0.5px dashed var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer;margin-bottom:10px}
.add-row-btn:hover{color:var(--text-secondary)}
.slide-progress{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border-mid);cursor:pointer;transition:all 0.15s}
.prog-dot.active{background:var(--text-primary);transform:scale(1.2)}
.prog-dot.filled{background:var(--green-pip)}
.prog-nav{display:flex;gap:6px;margin-left:auto}
.prog-nav button{font-size:12px;font-family:var(--font);padding:4px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer}
.prog-nav button:hover{background:var(--bg-tertiary)}
.prog-nav button:disabled{opacity:0.35;cursor:default}
.main-wrap{max-width:1100px;margin:0 auto;padding:20px 24px 0}
.bottom-bar{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;padding-bottom:40px}
.action-btn{font-size:13px;font-family:var(--font);padding:8px 16px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-primary);cursor:pointer;font-weight:500;transition:background 0.12s}
.action-btn:hover{background:var(--bg-tertiary)}
.action-btn.primary{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary)}
.action-btn.primary:hover{opacity:0.85}
/* Call analysis */
.call-log{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.call-entry{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden}
.call-entry-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.call-entry-header:hover{background:var(--bg-tertiary)}
.call-entry-meta{display:flex;align-items:center;gap:10px}
.call-date{font-size:12px;font-weight:500;color:var(--text-primary)}
.call-participants{font-size:11px;color:var(--text-tertiary)}
.call-finding-count{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.call-entry-body{border-top:0.5px solid var(--border-light);padding:12px 14px}
.call-transcript-preview{font-size:11px;color:var(--text-tertiary);font-family:monospace;background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:8px 10px;max-height:80px;overflow:hidden;margin-bottom:12px;white-space:pre-wrap;line-height:1.5}
.findings-list{display:flex;flex-direction:column;gap:6px}
.finding-card{border:0.5px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden}
.finding-card.accepted{border-color:var(--border-success)}
.finding-card.rejected{opacity:0.45}
.finding-header{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.finding-type{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px}
.ft-meddpicc{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.ft-pov{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.ft-stakeholder{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.ft-gap{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.ft-action{background:var(--bg-tertiary);color:var(--text-secondary);border:0.5px solid var(--border-mid)}
.ft-redflag{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.finding-body{flex:1}
.finding-title{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:3px}
.finding-evidence{font-size:11px;color:var(--text-tertiary);font-style:italic;margin-bottom:4px;line-height:1.5}
.finding-suggestion{font-size:12px;color:var(--text-secondary)}
.finding-actions{display:flex;gap:6px;padding:0 12px 10px;justify-content:flex-end}
.finding-btn{font-size:12px;font-family:var(--font);padding:4px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.finding-btn.accept{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.finding-btn.reject{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.finding-btn:hover{opacity:0.8}
.analyse-btn{font-size:13px;font-family:var(--font);padding:9px 20px;border-radius:var(--radius-md);border:0.5px solid var(--text-primary);background:var(--text-primary);color:var(--bg-primary);cursor:pointer;font-weight:500;transition:opacity 0.15s;display:flex;align-items:center;gap:8px}
.analyse-btn:hover{opacity:0.85}
.analyse-btn:disabled{opacity:0.45;cursor:default}

<script>
/* ================================================================
   FORMATTERS
   ================================================================ */

function formatCurrency(raw) {
  if (!raw || !raw.trim()) return '';
  let s = raw.trim().replace(/,/g, '');
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  s = s.replace(/^\$\s*/, '');
  let num = null;
  const lower = s.toLowerCase();
  if (/^[\d.]+t$/.test(lower))      num = parseFloat(lower) * 1e12;
  else if (/^[\d.]+b$/.test(lower)) num = parseFloat(lower) * 1e9;
  else if (/^[\d.]+m$/.test(lower)) num = parseFloat(lower) * 1e6;
  else if (/^[\d.]+k$/.test(lower)) num = parseFloat(lower) * 1e3;
  else if (/^[\d.]+$/.test(lower))  num = parseFloat(lower);
  if (num === null || isNaN(num)) return raw;
  if (neg) num = -num;
  const abs = Math.abs(num);
  if (abs >= 1e12) return '$' + (num / 1e12).toFixed(num % 1e12 === 0 ? 0 : 1) + 'T';
  if (abs >= 1e9)  return '$' + (num / 1e9).toFixed(num % 1e9 === 0 ? 0 : 1) + 'B';
  if (abs >= 1e6)  return '$' + (num / 1e6).toFixed(num % 1e6 === 0 ? 0 : 1) + 'M';
  if (abs >= 1e3)  return '$' + (num / 1e3).toFixed(num % 1e3 === 0 ? 0 : 1) + 'K';
  return '$' + Math.round(num).toLocaleString();
}

function formatQuarter(raw) {
  if (!raw || !raw.trim()) return '';
  const s = raw.trim();
  if (/^Q[1-4]\s+20\d{2}$/.test(s)) return s;
  const m = s.match(/[qQ]?([1-4])[\s\-\/]*(20)?(\d{2,4})/);
  if (m) {
    let yr = m[3];
    if (yr.length === 2) yr = '20' + yr;
    return 'Q' + m[1] + ' ' + yr;
  }
  const qonly = s.match(/^[qQ]([1-4])$/);
  if (qonly) return 'Q' + qonly[1] + ' ' + new Date().getFullYear();
  return raw;
}

function isCurrencyValid(f) {
  return /^\$[\d.]+[KMBT]?$/.test(f) || /^\$[\d,]+$/.test(f);
}
function isQuarterValid(f) {
  return /^Q[1-4]\s+20\d{2}$/.test(f);
}

function applyFmt(el, formatted, valid) {
  el.value = formatted;
  el.classList.toggle('fmt-ok', valid && formatted !== '');
  el.classList.toggle('fmt-err', !valid && formatted !== '');
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

function attachFormatter(el, type) {
  if (!el) return;
  el.addEventListener('blur', () => {
    if (type === 'currency') {
      const f = formatCurrency(el.value);
      applyFmt(el, f, isCurrencyValid(f));
    } else if (type === 'quarter') {
      const f = formatQuarter(el.value);
      applyFmt(el, f, isQuarterValid(f));
    }
  });
  el.addEventListener('focus', () => {
    el.classList.remove('fmt-ok', 'fmt-err');
  });
}

function attachFormatters() {
  ['snapshot.currentArr', 'snapshot.targetArr'].forEach(path => {
    attachFormatter(document.querySelector(`[data-f="${path}"]`), 'currency');
  });
  ['snapshot.renewalQ', 'accountpov.obj1date', 'accountpov.obj2date', 'accountpov.obj3date'].forEach(path => {
    attachFormatter(document.querySelector(`[data-f="${path}"]`), 'quarter');
  });
}

/* ================================================================
   DATA MODEL
   ================================================================ */

const SLIDES = [
  { id: 'snapshot',     title: 'Account Snapshot'   },
  { id: 'stakeholders', title: 'Stakeholder Map'     },
  { id: 'accountpov',   title: 'Account POV'         },
  { id: 'opppov',       title: 'Opportunity POV'     },
  { id: 'meddpicc',     title: 'MEDDPICC'            },
  { id: 'map',          title: 'Mutual Action Plan'  },
  { id: 'calls',        title: 'Call Analysis'       }
];

const MEDD = [
  { id: 'metrics', title: 'Metrics', desc: 'Does the champion quantify the pain?', blocker: false,
    icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    questions: [
      { text: 'Champion can articulate current cost of fragmented reporting — time, advisor fees, or coordination overhead', tag: 'quantified pain' },
      { text: 'A specific metric has been identified (hours/week, number of systems, reporting lag) that Eleven directly reduces', tag: 'success metric' },
      { text: "Champion has linked the metric to a decision-maker's stated priority (consolidation, control, or cost)", tag: 'exec alignment' },
      { text: 'Baseline has been established or champion will help establish it before demo', tag: 'baseline' }
    ]
  },
  { id: 'economic_buyer', title: 'Economic buyer', desc: 'Is the principal or CIO reachable?', blocker: true,
    icon: '<circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/><line x1="19" y1="11" x2="19" y2="17"/><line x1="16" y1="14" x2="22" y2="14"/>',
    questions: [
      { text: 'Champion has named the principal, CIO, or managing director who controls platform spend', tag: 'EB identified' },
      { text: 'Champion has direct access to EB — not filtered through a gatekeeping layer', tag: 'EB access' },
      { text: 'EB has expressed a view on consolidating family office tech or reducing advisor dependency', tag: 'EB awareness' },
      { text: 'A path to an EB-attended meeting or presentation has been discussed', tag: 'EB meeting path' }
    ]
  },
  { id: 'decision_criteria', title: 'Decision criteria', desc: "Do we know how they'll evaluate?", blocker: false,
    icon: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
    questions: [
      { text: 'Champion has described how a platform like Eleven would be evaluated (data security, breadth of integrations, UX for principal)', tag: 'eval criteria' },
      { text: "Eleven's differentiation has been mapped to their stated criteria — not a generic pitch", tag: 'differentiation fit' },
      { text: 'Incumbent solutions (spreadsheets, Addepar, Orion, custom-built) have been explicitly compared', tag: 'competitive map' },
      { text: 'Family office compliance or privacy requirements have been surfaced and addressed', tag: 'compliance' }
    ]
  },
  { id: 'decision_process', title: 'Decision process', desc: 'Is the path to onboarding clear?', blocker: true,
    icon: '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 01-9 9"/>',
    questions: [
      { text: 'Champion has described the internal steps required to approve a new platform (security review, legal, EB sign-off)', tag: 'process mapped' },
      { text: 'A proof-of-concept or structured onboarding scope has been agreed or proposed', tag: 'PoC defined' },
      { text: 'Timeline to first value milestone has been discussed — not open-ended', tag: 'timeline' },
      { text: 'Champion has confirmed they can move without a lengthy RFP or procurement cycle', tag: 'cycle speed' }
    ]
  },
  { id: 'data_integration', title: 'Data & integration readiness', desc: 'Can they actually onboard? (Most common blocker)', blocker: true,
    icon: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
    questions: [
      { text: 'Champion understands what data sources Eleven needs access to (custodians, estate docs, calendars, reporting feeds)', tag: 'data scope known' },
      { text: "No hard blocker on data sharing — legal, privacy counsel, or existing vendor lock-in has been acknowledged and isn't disqualifying", tag: 'data clearance' },
      { text: 'Champion or a named colleague owns the data/IT side and is willing to engage', tag: 'data owner named' },
      { text: 'At least one integration point (e.g. Addepar, Schwab, a custodian feed) has been confirmed as accessible', tag: 'integration confirmed' }
    ]
  },
  { id: 'champion', title: 'Champion', desc: 'Do we have a true internal sponsor?', blocker: true,
    icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    questions: [
      { text: 'Champion has power or strong influence over the platform decision — not just an evaluator', tag: 'power' },
      { text: 'Champion has a personal win tied to Eleven succeeding (time savings, credibility with principal, career)', tag: 'personal win' },
      { text: 'Champion has proactively shared intel, arranged introductions, or advocated internally', tag: 'active selling' },
      { text: 'Champion has not gone quiet — last meaningful engagement was within 3 weeks', tag: 'active engagement' }
    ]
  },
  { id: 'competition', title: 'Competition & inertia', desc: "What are we actually competing against?", blocker: false,
    icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
    questions: [
      { text: "The real competitor has been named — spreadsheets, existing wealth platform, internal ops team, or custom-built solution", tag: 'competition named' },
      { text: "Champion acknowledges status quo has a cost — it's not 'good enough' in their view", tag: 'status quo cost' },
      { text: 'No competing platform evaluation is in progress that would freeze the decision', tag: 'no parallel eval' },
      { text: "Eleven's UHNW-specific positioning (vs. generic wealth tools) has resonated with champion or EB", tag: 'positioning fit' }
    ]
  }
];

const AUM_RANGES = ['<$100M', '$100M–$500M', '$500M–$1B', '$1B–$5B', '$5B–$10B', '$10B+'];

function freshData() {
  return {
    snapshot:     { firmName: '', firmType: '', aum: '', contactCount: '', healthStatus: '', journey: '', currentArr: '', targetArr: '', renewalQ: '', notes: '', stakeholderGaps: '' },
    stakeholders: [],
    accountpov:   { whyChange: '', whyNow: '', whyUs: '', whatSolution: '', objective1: '', obj1date: '', objective2: '', obj2date: '', objective3: '', obj3date: '' },
    opppov:       { whitespace: '', incumbents: '', competitiveStrategy: '', competitive: '' },
    meddpicc:     { meddAnswers: {}, meddNotes: {}, gapOverrides: { __manual: [] } },
    map:          { rows: [], topAsk: '', lastEngagement: '', nextTouch: '' },
    calls:        []
  };
}

let opps = [{ name: 'New account', currentSlide: 0, openMedd: new Set(['metrics']), data: freshData() }];
let currentOpp = 0;
function opp() { return opps[currentOpp]; }
function d() { return opp().data; }
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ================================================================
   MEDDPICC SCORING
   ================================================================ */

function meddYes(id, count) {
  const a = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  let y = 0;
  for (let i = 0; i < count; i++) if (a[id + '_' + i] === 'yes') y++;
  return y;
}
function meddStatus(id, count) {
  const y = meddYes(id, count);
  if (y === count) return 'full';
  if (y >= Math.ceil(count / 2)) return 'partial';
  return 'low';
}
function calcScore() {
  const a = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  let yes = 0, total = 0;
  MEDD.forEach(s => s.questions.forEach((_, i) => { total++; if (a[s.id + '_' + i] === 'yes') yes++; }));
  return { yes, total };
}
function calcForecast() {
  const a = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  const bl = MEDD.filter(s => s.blocker);
  let bY = 0, bT = 0, tY = 0, tQ = 0;
  bl.forEach(s => s.questions.forEach((_, i) => { bT++; if (a[s.id + '_' + i] === 'yes') bY++; }));
  MEDD.forEach(s => s.questions.forEach((_, i) => { tQ++; if (a[s.id + '_' + i] === 'yes') tY++; }));
  const p = tY / tQ, bp = bY / bT;
  if (bp >= 0.75 && p >= 0.70) return 'Commit';
  if (bp >= 0.55 && p >= 0.50) return 'Upside';
  if (p >= 0.25 || tY >= 5) return 'Pipeline';
  return 'Omit';
}
const FC_CLASS = { Commit: 'fc-commit', Upside: 'fc-upside', Pipeline: 'fc-pipeline', Omit: 'fc-omit' };

/* ================================================================
   RENDER
   ================================================================ */

function render() {
  renderOppBar();
  renderSidebar();
  renderCurrentSlide();
  renderHeaderScore();
}

function renderHeaderScore() {
  const el = document.getElementById('headerScore');
  const { yes, total } = calcScore();
  const fc = calcForecast();
  el.innerHTML = `<span class="sc">${yes}/${total}</span><span class="forecast-badge ${FC_CLASS[fc]}">${fc}</span>`;
}

function renderOppBar() {
  const bar = document.getElementById('oppBar');
  bar.innerHTML = '';
  opps.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'opp-btn' + (i === currentOpp ? ' active' : '');
    btn.textContent = a.name;
    btn.onclick = () => switchOpp(i);
    btn.ondblclick = () => { const n = prompt('Rename:', a.name); if (n && n.trim()) { opps[i].name = n.trim(); renderOppBar(); } };
    bar.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'add-opp-btn';
  add.textContent = '+ Add opportunity';
  add.onclick = addOpp;
  bar.appendChild(add);
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  if (!nav) return;
  nav.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const btn = document.createElement('button');
    const filled = isSlideFilled(s.id);
    const isActive = i === opp().currentSlide;
    btn.className = 'nav-pill' + (isActive ? ' active' : '');
    btn.innerHTML = s.title + `<span class="nav-pip${filled ? ' filled' : ''}"></span>`;
    btn.onclick = () => { opp().currentSlide = i; render(); };
    nav.appendChild(btn);
  });
}

function isSlideFilled(id) {
  if (id === 'snapshot')     return !!(d().snapshot.firmName && d().snapshot.firmType && d().snapshot.healthStatus);
  if (id === 'stakeholders') return d().stakeholders.length > 0;
  if (id === 'accountpov')   return !!(d().accountpov && d().accountpov.whyChange && d().accountpov.whyNow);
  if (id === 'opppov')       return !!(d().opppov && d().opppov.whitespace);
  if (id === 'meddpicc')     return calcScore().yes > 0;
  if (id === 'map')          return d().map.rows.length > 0 && !!d().map.topAsk;
  if (id === 'calls')        return (d().calls || []).length > 0;
  return false;
}

function renderCurrentSlide() {
  const c = document.getElementById('slidesContainer');
  c.innerHTML = '';
  const sid = SLIDES[opp().currentSlide].id;
  const slide = document.createElement('div');
  slide.className = 'slide visible';
  slide.innerHTML = buildSlide(sid);
  c.appendChild(slide);
  attachListeners();
  attachFormatters();
}

/* ================================================================
   SLIDE BUILDERS
   ================================================================ */

function buildSlide(id) {
  if (id === 'snapshot')     return buildSnapshot();
  if (id === 'stakeholders') return buildStakeholders();
  if (id === 'accountpov')   return buildAccountPov();
  if (id === 'opppov')       return buildOppPov();
  if (id === 'meddpicc')     return buildMeddpiccSlide();
  if (id === 'map')          return buildMap();
  if (id === 'calls')        return buildCalls();
  return '';
}

function buildAccountPov() {
  const p = d().accountpov || {};
  return `<div class="slide-title">Account POV</div>
<div class="pov-grid">
  <div class="pov-card"><div class="pov-q">Why change?</div>

function buildMeddSection(s) {
  const isOpen = opp().openMedd.has(s.id);
  const a = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  const notes = (d().meddpicc && d().meddpicc.meddNotes) || {};
  const yes = meddYes(s.id, s.questions.length);
  const total = s.questions.length;
  const status = meddStatus(s.id, total);
  const pips = Array.from({ length: total }, (_, i) => `<span class="pip ${i < yes ? (status === 'full' ? 'filled' : 'partial') : ''}"></span>`).join('');
  let body = '';
  if (isOpen) {
    body = '<div class="medd-body">';
    s.questions.forEach((q, i) => {
      const key = s.id + '_' + i;
      const val = a[key] || '';
      body += `<div class="medd-question">
  <div><div class="q-text">${q.text}</div><div class="q-tag">${q.tag}</div></div>
  <div class="tog-group">
    <button class="tog ${val === 'yes' ? 'yes' : ''}" onclick="setMeddAnswer('${s.id}',${i},'yes')">Yes</button>
    <button class="tog ${val === 'no' ? 'no' : ''}" onclick="setMeddAnswer('${s.id}',${i},'no')">No</button>
  </div>
</div>`;
    });
    body += `<div class="medd-notes"><textarea rows="2" placeholder="Notes for ${s.title.toLowerCase()}…" onchange="setMeddNote('${s.id}',this.value)">${esc(notes[s.id] || '')}</textarea></div>`;
    body += '</div>';
  }
  return `<div class="medd-section">
  <div class="medd-section-header" onclick="toggleMedd('${s.id}')">
    <div class="medd-left">
      <div class="medd-icon"><svg viewBox="0 0 24 24">${s.icon}</svg></div>
      <div>
        <div class="medd-title-row">
          <span class="medd-title">${s.title}</span>
          ${s.blocker ? '<span class="blocker-tag">blocker</span>' : ''}
        </div>
        <div class="pip-row">${pips}</div>
        <div class="medd-desc">${s.desc}</div>
      </div>
    </div>
    <svg class="chevron ${isOpen ? 'open' : ''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  ${body}
</div>`;
}

function buildGapsTable() {
  const ma = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  const ov = (d().meddpicc && d().meddpicc.gapOverrides) || {};
  const manual = (ov.__manual || []);
  const autoRows = MEDD.filter(s => s.blocker && meddYes(s.id, s.questions.length) < Math.ceil(s.questions.length / 2));
  if (autoRows.length === 0 && manual.length === 0) {
    return `<div class="gaps-empty"><span class="gaps-empty-dot"></span>No weak blocker sections — all critical areas at 50%+ confirmed.</div>`;
  }
  let html = `<table class="gaps-table"><thead><tr>
    <th style="width:110px">Section</th><th>Gap</th><th>Action to close</th>
    <th style="width:66px">Owner</th><th style="width:60px">By</th><th style="width:20px"></th>
  </tr></thead><tbody>`;
  autoRows.forEach(s => {
    html += `<tr>
  <td><span class="gap-badge gap-blocker">${s.title}</span></td>
  <td><input data-gap="${s.id}_gap" value="${esc(ov[s.id + '_gap'] || '')}" placeholder="What's missing?"></td>
  <td><input data-gap="${s.id}_action" value="${esc(ov[s.id + '_action'] || '')}" placeholder="Next step to resolve"></td>
  <td><input data-gap="${s.id}_owner" value="${esc(ov[s.id + '_owner'] || '')}" placeholder="Tim/Beth"></td>
  <td><input data-gap="${s.id}_by" value="${esc(ov[s.id + '_by'] || '')}" placeholder="Jun 1"></td>
  <td></td>
</tr>`;
  });
  manual.forEach((r, i) => {
    html += `<tr>
  <td><span class="gap-badge gap-custom">${esc(r.section || 'Custom')}</span></td>
  <td><input data-mgap="${i}_gap" value="${esc(r.gap || '')}" placeholder="What's missing?"></td>
  <td><input data-mgap="${i}_action" value="${esc(r.action || '')}" placeholder="Next step to resolve"></td>

  <td><button class="gap-rm" onclick="removeGapRow(${i})">×</button></td>
</tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function attachListeners() {
  document.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      setDeep(el.getAttribute('data-f'), el.value);
      renderHeaderScore();
    });
  });
  document.querySelectorAll('[data-stk]').forEach(el => {
    el.addEventListener('input', () => {
      const [i, field] = el.getAttribute('data-stk').split('.');
      if (d().stakeholders[+i]) d().stakeholders[+i][field] = el.value;
    });
  });
  document.querySelectorAll('[data-map]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const [i, field] = el.getAttribute('data-map').split('.');
      if (!d().map.rows[+i]) d().map.rows[+i] = {};
      d().map.rows[+i][field] = el.value;
    });
  });
  document.querySelectorAll('[data-gap]').forEach(el => {
    el.addEventListener('input', () => {
      if (!d().meddpicc.gapOverrides) d().meddpicc.gapOverrides = { __manual: [] };
      d().meddpicc.gapOverrides[el.getAttribute('data-gap')] = el.value;
    });
  });
  document.querySelectorAll('[data-mgap]').forEach(el => {
    el.addEventListener('input', () => {
      const [i, field] = el.getAttribute('data-mgap').split('_');
      const m = d().meddpicc.gapOverrides.__manual;
      if (m && m[+i]) m[+i][field] = el.value;
    });
  });
}

function setDeep(path, val) {
  const parts = path.split('.');

  obj[parts[parts.length - 1]] = val;
}
function toggleMedd(id) {

/* ================================================================
   EXPORT — CSV
   Two sheets encoded as separate CSV blocks separated by a blank
   line and a header row: (1) Opportunity summary, (2) MEDDPICC detail.
   Opens cleanly in Excel, Numbers, and Google Sheets.
   ================================================================ */

function csvCell(v) {
  const s = (v == null ? '' : String(v)).replace(/"/g, '""');
  return /[,"\n\r]/.test(s) ? '"' + s + '"' : s;
}
function csvRow(arr) { return arr.map(csvCell).join(',') + '\r\n'; }

function exportPlan() {
  let csv = '';

  // ── Sheet 1: Opportunity summary (one row per opportunity) ──
  csv += csvRow(['ELEVEN SYSTEMS — OPPORTUNITY PLAN EXPORT', 'Generated: ' + new Date().toLocaleDateString()]);
  csv += '\r\n';
  csv += csvRow([
    'Opportunity', 'Type', 'AUM', 'Journey', 'Health',
    'Current ARR', 'Target ARR', 'Renewal / Close',
    'Forecast', 'MEDDPICC Score', 'MEDDPICC %', 'Weak Blockers',
    'Why Change', 'Why Now', 'Why Eleven', 'Solution / Value',
    'Incumbents', 'Competitive Strategy',
    'Champion', 'Economic Buyer', 'Stakeholder Count',
    '#1 Ask', 'Next Touch', 'Last Engagement',
    'Obj 1', 'Obj 1 Date', 'Obj 2', 'Obj 2 Date', 'Obj 3', 'Obj 3 Date',
    'Context / Notes'
  ]);

  opps.forEach(a => {
    const s  = a.data.snapshot;
    const p  = a.data.accountpov;
    const o  = a.data.opppov;
    const m  = a.data.map;
    const ma = o.meddAnswers || {};

    // Score
    let yes = 0, total = 0;
    MEDD.forEach(ms => ms.questions.forEach((_, i) => {
      total++;
      if (ma[ms.id + '_' + i] === 'yes') yes++;
    }));
    const bl = MEDD.filter(sec => sec.blocker);
    let bY = 0, bT = 0;
    bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
    const pct = yes / total, bp = bY / bT;
    let fc = 'Omit';
    if (bp >= 0.75 && pct >= 0.70) fc = 'Commit';
    else if (bp >= 0.55 && pct >= 0.50) fc = 'Upside';
    else if (pct >= 0.25 || yes >= 5) fc = 'Pipeline';

    const weakBlockers = MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).map(ms => ms.title).join('; ');

    const champion = a.data.stakeholders.find(st => st.role === 'Champion');
    const eb       = a.data.stakeholders.find(st => st.role === 'Economic buyer');

    csv += csvRow([
      a.name, s.firmType, s.aum, s.journey, s.healthStatus,
      s.currentArr, s.targetArr, s.renewalQ,
      fc, yes + '/' + total, Math.round(pct * 100) + '%', weakBlockers || 'None',
      p.whyChange, p.whyNow, p.whyUs, p.whatSolution,
      o.incumbents, o.competitiveStrategy,
      champion ? champion.name + ' (' + champion.sentiment + ')' : '',
      eb        ? eb.name + ' (' + eb.sentiment + ')' : '',
      a.data.stakeholders.length,
      m.topAsk, m.nextTouch, m.lastEngagement,
      p.objective1, p.obj1date, p.objective2, p.obj2date, p.objective3, p.obj3date,
      s.notes
    ]);
  });

  // ── Sheet 2: MEDDPICC detail (one row per section per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['MEDDPICC DETAIL']);
  csv += csvRow(['Opportunity', 'Section', 'Blocker', 'Score', 'Q1', 'Q2', 'Q3', 'Q4', 'Notes']);

  opps.forEach(a => {
    const ma    = a.data.meddpicc.meddAnswers || {};
    const notes = a.data.meddpicc.meddNotes   || {};
    MEDD.forEach(ms => {
      const answers = ms.questions.map((_, i) => ma[ms.id + '_' + i] === 'yes' ? 'Yes' : ma[ms.id + '_' + i] === 'no' ? 'No' : '');
      const sectionYes = answers.filter(v => v === 'Yes').length;
      csv += csvRow([
        a.name, ms.title, ms.blocker ? 'Yes' : 'No',
        sectionYes + '/' + ms.questions.length,
        ...answers,
        notes[ms.id] || ''
      ]);
    });
  });

  // ── Sheet 3: Gaps (one row per gap per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['OPPORTUNITY GAPS']);
  csv += csvRow(['Opportunity', 'Section', 'Type', 'Gap', 'Action to Close', 'Owner', 'By']);

  opps.forEach(a => {
    const ma = a.data.meddpicc.meddAnswers  || {};
    const ov = a.data.meddpicc.gapOverrides || {};
    MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).forEach(ms => {
      csv += csvRow([
        a.name, ms.title, 'Blocker',
        ov[ms.id + '_gap']    || '',
        ov[ms.id + '_action'] || '',
        ov[ms.id + '_owner']  || '',
        ov[ms.id + '_by']     || ''
      ]);
    });
    (ov.__manual || []).forEach(r => {
      csv += csvRow([a.name, r.section || 'Custom', 'Manual', r.gap || '', r.action || '', r.owner || '', r.by || '']);
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'eleven_opportunity_plan_' + new Date().toISOString().slice(0, 10) + '.csv';
  link.click();
}

/* ================================================================
   OPPORTUNITY LOG
   Uses localStorage so the log persists across browser sessions.
   Key: 'eleven_opp_log'  Value: JSON array of log entries.
   ================================================================ */

function getLog() {
  try { return JSON.parse(localStorage.getItem('eleven_opp_log') || '[]'); }
  catch(e) { return []; }
}
function setLog(entries) {
  try { localStorage.setItem('eleven_opp_log', JSON.stringify(entries)); }
  catch(e) {}
}

function buildLogEntry(a) {
  const s = a.data.snapshot;
  const o = a.data.opppov;
  const m = a.data.map;
  const ma = o.meddAnswers || {};
  let yes = 0, total = 0;
  MEDD.forEach(ms => ms.questions.forEach((_, i) => {
    total++;
    if (ma[ms.id + '_' + i] === 'yes') yes++;
  }));
  const bl = MEDD.filter(sec => sec.blocker);
  let bY = 0, bT = 0;
  bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
  const p = yes / total, bp = bY / bT;
  let fc = 'Omit';
  if (bp >= 0.75 && p >= 0.70) fc = 'Commit';
  else if (bp >= 0.55 && p >= 0.50) fc = 'Upside';
  else if (p >= 0.25 || yes >= 5) fc = 'Pipeline';
  return {
    id: a.id || (a.id = Date.now() + '_' + Math.random().toString(36).slice(2)),
    name: a.name,
    firmType: s.firmType || '',
    aum: s.aum || '',
    currentArr: s.currentArr || '',
    targetArr: s.targetArr || '',
    healthStatus: s.healthStatus || '',
    journey: s.journey || '',
    meddScore: yes,
    meddTotal: total,
    forecast: fc,
    nextTouch: m.nextTouch || '',
    topAsk: m.topAsk || '',
    savedAt: new Date().toISOString()
  };
}

function saveToLog() {
  // Ensure the current opp has a stable id
  if (!opps[currentOpp].id) opps[currentOpp].id = Date.now() + '_' + Math.random().toString(36).slice(2);
  const entry = buildLogEntry(opps[currentOpp]);
  const log = getLog();
  const idx = log.findIndex(e => e.id === entry.id);
  if (idx >= 0) log[idx] = entry;  // update existing
  else log.unshift(entry);          // prepend new
  setLog(log);
  updateLogCount();
  // Flash save indicator
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
}

function updateLogCount() {
  const el = document.getElementById('logCount');
  if (el) el.textContent = getLog().length;
}

function openLog() {
  renderLog();
  document.getElementById('logOverlay').classList.add('open');
}

function closeLog() {
  document.getElementById('logOverlay').classList.remove('open');
}

function closeLogOnBg(e) {
  if (e.target === document.getElementById('logOverlay')) closeLog();
}

function renderLog() {
  const log = getLog();
  // Summary bar
  const summary = document.getElementById('logSummary');
  const totalARR = log.reduce((sum, e) => {
    const n = parseFloat((e.targetArr || '').replace(/[^0-9.]/g, ''));
    const mult = /T$/i.test(e.targetArr) ? 1e12 : /B$/i.test(e.targetArr) ? 1e9 : /M$/i.test(e.targetArr) ? 1e6 : /K$/i.test(e.targetArr) ? 1e3 : 1;
    return sum + (isNaN(n) ? 0 : n * mult);
  }, 0);
  const commits = log.filter(e => e.forecast === 'Commit').length;
  const upsides = log.filter(e => e.forecast === 'Upside').length;
  const pipes   = log.filter(e => e.forecast === 'Pipeline').length;
  function fmtARR(n) {
    if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
    return n > 0 ? '$' + n : '—';
  }
  summary.innerHTML = `
    <div class="log-stat"><div class="ls-val">${log.length}</div><div class="ls-lbl">Opportunities</div></div>
    <div class="log-stat"><div class="ls-val">${fmtARR(totalARR)}</div><div class="ls-lbl">Target ARR</div></div>
    <div class="log-stat"><div class="ls-val" style="color:var(--text-success)">${commits}</div><div class="ls-lbl">Commit</div></div>
    <div class="log-stat"><div class="ls-val" style="color:var(--text-info)">${upsides} <span style="font-size:13px;color:var(--text-tertiary)">/ ${pipes}</span></div><div class="ls-lbl">Upside / Pipeline</div></div>
  `;
  // Table rows
  const tbody = document.getElementById('logTableBody');
  const empty = document.getElementById('logEmpty');
  if (log.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const FC_CLASS = { Commit: 'fc-commit', Upside: 'fc-upside', Pipeline: 'fc-pipeline', Omit: 'fc-omit' };
  tbody.innerHTML = log.map((e, i) => {
    const pct = Math.round((e.meddScore / e.meddTotal) * 100);
    const saved = new Date(e.savedAt);
    const savedStr = saved.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<tr onclick="jumpToOpp('${e.id}')">
  <td>
    <div class="log-name">${esc(e.name)}</div>
    <div class="log-sub">${esc(e.aum || '—')} ${e.journey ? '· ' + e.journey : ''}</div>
  </td>
  <td><span style="font-size:12px;color:var(--text-secondary)">${esc(e.firmType || '—')}</span></td>
  <td>
    <div class="log-arr">${esc(e.currentArr || '—')}</div>
    <div class="log-arr-target">&#8594; ${esc(e.targetArr || '—')}</div>
  </td>
  <td>
    <div class="log-medd">${e.meddScore}/${e.meddTotal}</div>
    <div class="log-medd-bar"><div class="log-medd-fill" style="width:${pct}%"></div></div>
  </td>
  <td><span class="forecast-badge ${FC_CLASS[e.forecast] || 'fc-omit'}" style="font-size:11px;padding:2px 9px">${e.forecast}</span></td>
  <td><span class="log-next">${esc(e.nextTouch || '—')}</span></td>
  <td><span class="log-updated">${savedStr}</span></td>
</tr>`;
  }).join('');
}

function jumpToOpp(id) {
  const idx = opps.findIndex(o => o.id === id);
  if (idx >= 0) { currentOpp = idx; closeLog(); render(); }
  else { alert('This opportunity is in the log but not in the current session. Reload the plan and re-save to sync.'); }
}

/* ================================================================
   CALL ANALYSIS
   ================================================================ */

function buildCalls() {
  const calls = d().calls || [];
  let callsHTML = '';
  if (calls.length === 0) {
    callsHTML = '<div class="call-empty">No calls logged yet. Paste a transcript below to analyse it.</div>';
  } else {
    callsHTML = '<div class="call-log">' + calls.map((c, ci) => {
      const accepted = (c.findings || []).filter(f => f.status === 'accepted').length;
      const pending  = (c.findings || []).filter(f => !f.status).length;
      const isOpen   = c.open !== false;
      let findingsHTML = '';
      if (isOpen && c.findings && c.findings.length > 0) {
        const redFlags = c.findings.filter(f => f.type === 'red_flag');
        const others   = c.findings.filter(f => f.type !== 'red_flag');
        if (redFlags.length > 0) {
          findingsHTML += redFlags.map(f => `<div class="red-flag-box">
  <div class="red-flag-label">🚩 Red flag</div>
  <div class="red-flag-text">${esc(f.title)}</div>
  ${f.evidence ? '<div style="font-size:11px;color:var(--text-danger);margin-top:3px;font-style:italic">' + esc(f.evidence) + '</div>' : ''}
</div>`).join('');
        }
        findingsHTML += '<div class="findings-list">' + others.map((f, fi) => {
          const typeClass = { meddpicc: 'ft-meddpicc', pov: 'ft-pov', stakeholder: 'ft-stakeholder', gap: 'ft-gap', action: 'ft-action' }[f.type] || 'ft-action';
          const typeLabel = { meddpicc: 'MEDDPICC', pov: 'POV update', stakeholder: 'Stakeholder', gap: 'Gap', action: 'Next action' }[f.type] || f.type;
          const cardClass = f.status === 'accepted' ? ' accepted' : f.status === 'rejected' ? ' rejected' : '';
          return `<div class="finding-card${cardClass}">
  <div class="finding-header">
    <span class="finding-type ${typeClass}">${typeLabel}</span>
    <div class="finding-body">
      <div class="finding-title">${esc(f.title)}</div>
      ${f.evidence ? '<div class="finding-evidence">"' + esc(f.evidence) + '"</div>' : ''}
      ${f.suggestion ? '<div class="finding-suggestion">→ ${esc(f.suggestion)}</div>' : ''}
    </div>
  </div>
  ${f.status ? '<div style="font-size:11px;padding:0 12px 8px;color:' + (f.status === 'accepted' ? 'var(--text-success)' : 'var(--text-tertiary)') + '">✓ ' + (f.status === 'accepted' ? 'Accepted' : 'Dismissed') + '</div>' :
    `<div class="finding-actions">
      <button class="finding-btn" onclick="dismissFinding(${ci},${fi})">Dismiss</button>
      <button class="finding-btn accept" onclick="acceptFinding(${ci},${fi})">Accept &amp; apply</button>
    </div>`}
</div>`;
        }).join('') + '</div>';
      }
      return `<div class="call-entry">
  <div class="call-entry-header" onclick="toggleCall(${ci})">
    <div class="call-entry-meta">
      <span class="call-date">${esc(c.date || 'Undated call')}</span>
      <span class="call-participants">${esc(c.participants || '')}</span>
      ${c.findings && c.findings.length ? `<span class="call-finding-count">${accepted} applied · ${pending} pending</span>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="call-remove" onclick="event.stopPropagation();removeCall(${ci})">remove</button>
      <svg style="width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;${isOpen ? 'transform:rotate(180deg)' : ''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
  ${isOpen ? `<div class="call-entry-body">
    <div class="call-transcript-preview">${esc((c.transcript || '').slice(0, 400))}${(c.transcript || '').length > 400 ? '…' : ''}</div>
    ${findingsHTML || '<div style="font-size:12px;color:var(--text-tertiary)">No findings yet.</div>'}
  </div>` : ''}
</div>`;
    }).join('') + '</div>';
  }

  return `<div class="slide-label">Section 6</div>
<div class="slide-title">Call analysis</div>
${callsHTML}
<div class="call-form">
  <div class="call-form-title">Log a new call</div>
  <div class="field-grid">
    <div>
      <div class="field-label">Call date</div>
      <input class="field-input" id="callDate" placeholder="e.g. 21 May 2026">
    </div>
    <div>
      <div class="field-label">Participants</div>
      <input class="field-input" id="callParticipants" placeholder="e.g. Beth, Marcus Webb (CIO)">
    </div>
  </div>
  <div class="field-full">
    <div class="field-label">Transcript <span class="fmt-hint">paste from Gong, Fathom, Otter, or any txt export</span></div>
    <textarea class="field-input" id="callTranscript" rows="8" placeholder="Paste transcript here…&#10;&#10;Speaker labels are helpful but not required. The more context, the better the analysis."></textarea>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
    <button class="analyse-btn" id="analyseBtn" onclick="analyseCall()">
      <span id="analyseBtnText">Analyse against plan</span>
    </button>
    <span style="font-size:11px;color:var(--text-tertiary)">Claude will map findings to your MEDDPICC, POV, stakeholders, and gaps. You review before anything is applied.</span>
  </div>
  <div id="analyseError" style="font-size:12px;color:var(--text-danger);margin-top:8px;display:none"></div>
</div>`;
}

function toggleCall(ci) {
  const calls = d().calls || [];
  if (calls[ci]) { calls[ci].open = calls[ci].open === false ? true : false; }
  renderCurrentSlide();
}

function removeCall(ci) {
  if (!confirm('Remove this call log?')) return;
  d().calls.splice(ci, 1);
  renderCurrentSlide();
}

async function analyseCall() {
  const transcript = document.getElementById('callTranscript').value.trim();
  if (!transcript) { showAnalyseError('Please paste a transcript first.'); return; }
  const date         = document.getElementById('callDate').value.trim();
  const participants = document.getElementById('callParticipants').value.trim();

  setAnalysing(true);

  // Build plan context snapshot to send alongside the transcript
  const s   = d().snapshot;
  const p   = d().accountpov;
  const o   = d().opppov;
  const stk = d().stakeholders;
  const ma  = o.meddAnswers || {};

  const meddContext = MEDD.map(ms => {
    const answers = ms.questions.map((q, i) => {
      const a = ma[ms.id + '_' + i];
      return `    [${a === 'yes' ? 'YES' : a === 'no' ? 'NO' : 'UNANSWERED'}] ${q.text}`;
    }).join('\n');
    return `  ${ms.title}${ms.blocker ? ' (BLOCKER)' : ''}:\n${answers}`;
  }).join('\n');

  const planContext = `OPPORTUNITY: ${opp().name}
FIRM TYPE: ${s.firmType || 'unknown'}
AUM: ${s.aum || 'unknown'}

CURRENT MEDDPICC STATE:
${meddContext}

CURRENT POV:
- Why change: ${p.whyChange || 'not set'}
- Why now: ${p.whyNow || 'not set'}
- Why Eleven: ${p.whyUs || 'not set'}

CURRENT STAKEHOLDERS:
${stk.length ? stk.map(st => `- ${st.role}: ${st.name || 'unnamed'} (${st.sentiment})`).join('\n') : 'None logged'}

INCUMBENTS: ${o.incumbents || 'not set'}
COMPETITIVE STRATEGY: ${o.competitiveStrategy || 'not set'}`;

  const prompt = `You are a B2B sales analyst reviewing a call transcript against an opportunity plan for Eleven Systems, an AI platform for UHNW wealth management and family office life management.

CURRENT PLAN STATE:
${planContext}

CALL TRANSCRIPT:
${transcript}

Analyse the transcript against the plan. Return ONLY valid JSON — no preamble, no markdown, no explanation outside the JSON.

Return this exact structure:
{
  "findings": [
    {
      "type": "meddpicc" | "pov" | "stakeholder" | "gap" | "action" | "red_flag",
      "title": "short descriptive title (max 12 words)",
      "evidence": "direct quote or close paraphrase from transcript (max 30 words)",
      "suggestion": "what should change in the plan (max 20 words)",
      "apply": {
        "field": "the data field to update if accepted",
        "value": "the value to set"
      }
    }
  ]
}

Rules:
- Only surface findings that are NEW or CONTRADICTORY to the current plan state. Do not repeat what is already confirmed.
- For type "meddpicc": apply.field = "meddpicc.[section_id].[question_index]", apply.value = "yes" or "no"
- For type "pov": apply.field = "pov.[whyChange|whyNow|whyUs|whatSolution]", apply.value = updated text
- For type "stakeholder": apply.field = "stakeholder.new" or "stakeholder.[name].sentiment", apply.value = the value
- For type "gap": apply.field = "gap.[medd_section_id]", apply.value = gap description
- For type "action": apply.field = "map.nextTouch", apply.value = suggested next action
- For type "red_flag": no apply needed — these are warnings only. Use for signs champion is stalling, EB is blocked, competitor is advancing, or trust has eroded.
- Be conservative. Prefer fewer high-confidence findings over many speculative ones.
- Maximum 10 findings total.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    const findings = (parsed.findings || []).map(f => ({ ...f, status: null }));

    if (!d().calls) d().calls = [];
    d().calls.unshift({
      date: date || new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      participants,
      transcript,
      findings,
      open: true
    });

    setAnalysing(false);
    renderCurrentSlide();

  } catch (err) {
    setAnalysing(false);
    showAnalyseError('Analysis failed: ' + err.message + '. Check your connection and try again.');
  }
}

function setAnalysing(on) {
  const btn  = document.getElementById('analyseBtn');
  const txt  = document.getElementById('analyseBtnText');
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="analyse-spinner"></span><span>Analysing…</span>'
    : '<span id="analyseBtnText">Analyse against plan</span>';
}

function showAnalyseError(msg) {
  const el = document.getElementById('analyseError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function acceptFinding(ci, fi) {
  const f = d().calls[ci].findings[fi];
  f.status = 'accepted';
  // Apply the finding to the plan
  if (f.apply && f.apply.field) {
    const { field, value } = f.apply;
    if (field.startsWith('meddpicc.')) {
      const parts = field.split('.');
      const key = parts[1] + '_' + parts[2];
      d().meddpicc.meddAnswers[key] = value;
    } else if (field.startsWith('pov.')) {
      const key = field.split('.')[1];
      if (d().accountpov[key] !== undefined) d().accountpov[key] = value;
    } else if (field === 'map.nextTouch') {
      d().map.nextTouch = value;
    } else if (field === 'stakeholder.new') {
      d().stakeholders.push({ role: 'Neutral', name: value, title: '', sentiment: 'Neutral', win: '' });
    } else if (field.startsWith('gap.')) {
      const sid = field.split('.')[1];
      if (!d().meddpicc.gapOverrides) d().meddpicc.gapOverrides = { __manual: [] };
      d().meddpicc.gapOverrides[sid + '_gap'] = value;
    }
  }
  renderCurrentSlide();
  renderHeaderScore();
}

function dismissFinding(ci, fi) {
  d().calls[ci].findings[fi].status = 'rejected';
  renderCurrentSlide();
}

render();
updateLogCount();
</script>
